# L'API de scores : l'image publiée par la pipeline, taguée au sha d'un commit (jamais latest)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scores-api
  namespace: clickfast
spec:
  replicas: 3
  # Zéro coupure : un nouveau pod doit être prêt avant qu'un ancien parte (un pod de plus pendant la bascule)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: scores-api
  template:
    metadata:
      labels:
        app: scores-api
    spec:
      containers:
        - name: scores-api
          image: arrow91/clickfast-api:6a89014a40afaa373e4b6af53f9a5f12a45265db
          ports:
            - containerPort: 3000
          # Toute la config vient du cluster : rien dans l'image, rien en clair dans le dépôt
          envFrom:
            - configMapRef:
                name: scores-config
            - secretRef:
                name: scores-secret
          # Readiness : le pod ne reçoit du trafic qu'une fois que Node répond. En échec, il sort du Service
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          # Liveness : si /health ne répond plus 3 fois de suite, le conteneur est redémarré.
          # Limite connue : /health ne touche pas la base, ces deux sondes ne voient pas une base coupée
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
# Adresse stable devant les pods : "scores-api" dans le namespace, port 80 vers le 3000 des conteneurs
apiVersion: v1
kind: Service
metadata:
  name: scores-api
  namespace: clickfast
spec:
  type: ClusterIP
  selector:
    app: scores-api
  ports:
    - port: 80
      targetPort: 3000
