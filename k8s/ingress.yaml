# Porte d'entrée HTTP : Traefik (fourni par k3s) route scores.localhost vers le Service de l'API.
# Le port 8080 de la machine arrive sur le port 80 du cluster (k3d cluster create -p "8080:80@loadbalancer").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scores-ingress
  namespace: clickfast
spec:
  ingressClassName: traefik
  rules:
    - host: scores.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scores-api
                port:
                  number: 80
