name: API de scores

# Toute branche teste ; seul un push sur main publie (voir les "if" des jobs)
on:
  push:
    paths:
      - "api/**"
      - "deploy/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  # Tests d'intégration : la vraie API contre un vrai PostgreSQL, jetable, détruit à la fin du job
  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Même version que la prod : un test sur une autre version ne prouve rien pour la prod
        image: postgres:18.6-alpine
        env:
          # Identifiants d'une base de test jetable, qui ne vit que le temps du job : pas des secrets
          POSTGRES_USER: clickfast_test
          POSTGRES_PASSWORD: clickfast_test
          POSTGRES_DB: clickfast_test
        ports:
          - 5432:5432
        # Les tests attendent que Postgres accepte vraiment les connexions, sinon ils échouent au hasard
        options: >-
          --health-cmd "pg_isready -U clickfast_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Un services: est joignable sur localhost depuis le job (pas par son nom, contrairement à Compose)
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: clickfast_test
      DB_PASSWORD: clickfast_test
      DB_NAME: clickfast_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # Le schéma existe avant le premier test
      - run: npm run migrate
      - run: npm run test:integration

  # Publication de l'image de l'API, taguée au sha du commit : sur main uniquement
  build-and-push:
    # Rien ne part tant que l'API n'a pas prouvé qu'elle marche contre une vraie base
    needs: [test, test-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast-api:${{ github.sha }}

  # Déploiement sur vm-prod : ce job tourne CHEZ NOUS (runner self-hosted), seul endroit qui joint la machine
  deploy:
    needs: build-and-push
    # Push sur main uniquement : une branche ou une pull request ne fait jamais tourner de code sur notre machine
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # Jamais deux déploiements en même temps sur la même machine
    concurrency: deploy-vm-prod
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      TAG: ${{ github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      # Sur ce poste Windows, "bash" désigne WSL : on place Git Bash (ssh, scp, ssh-agent) en tête du PATH
      - name: Git Bash pour les étapes suivantes
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"

      - uses: actions/checkout@v7

      - name: Machine d'exécution
        run: |
          echo "Runner : $(hostname)"
          docker ps --format '{{.Names}}' | grep -x vm-prod || { echo "vm-prod ne tourne pas sur ce poste"; exit 1; }

      # La clé privée reste en mémoire dans l'agent SSH : elle n'est jamais écrite sur le disque du runner
      - name: Agent SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add - 2> /dev/null
          tmp=$(cygpath -u "$RUNNER_TEMP")
          # Config SSH du job : l'alias vm-prod porte l'adresse, le port et l'utilisateur venus des secrets.
          # accept-new : la clé d'hôte est notée à la 1re connexion du job, refusée si elle change ensuite.
          cat > "$tmp/ssh_config" <<CONF
          Host vm-prod
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            StrictHostKeyChecking accept-new
            UserKnownHostsFile $tmp/known_hosts
            ConnectTimeout 10
            BatchMode yes
          CONF
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "SSH_CONFIG=$tmp/ssh_config"
          } >> "$GITHUB_ENV"

      # compose.yml et la config du monitoring partent du dépôt : rien ne se modifie à la main en prod
      - name: Envoi de compose.yml et du monitoring
        run: scp -F "$SSH_CONFIG" -r deploy/compose.yml deploy/monitoring vm-prod:/srv/clickfast/

      # pull d'abord : si le tag n'existe pas, on s'arrête là, l'ancienne version tourne toujours
      - name: Déploiement de ${{ github.sha }}
        run: |
          ssh -F "$SSH_CONFIG" vm-prod "
            set -e
            cd /srv/clickfast
            export TAG=$TAG
            docker compose pull --quiet scores-api
            docker compose up -d --wait --wait-timeout 90
            # Prometheus relit sa config sans redémarrer (SIGHUP envoyé de l'intérieur : un "docker kill",
            # même avec HUP, compte comme un arrêt manuel et Prometheus ne repart plus au redémarrage)
            docker compose exec -T prometheus kill -HUP 1
            if [ -f TAG ]; then cp TAG PREVIOUS_TAG; fi
            echo $TAG > TAG
            docker compose ps --format '{{.Name}} {{.Image}} {{.Status}}'
          "

      - name: Vérification de /health
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS "http://$DEPLOY_HOST:3000/health"; then echo; echo "API en ligne"; exit 0; fi
            sleep 2
          done
          echo "L'API ne répond pas sur /health après le déploiement"
          exit 1

      - name: Arrêt de l'agent SSH
        if: always()
        run: if [ -n "$SSH_AGENT_PID" ]; then ssh-agent -k > /dev/null; fi
