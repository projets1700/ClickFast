name: API de scores

# Toute branche teste ; seul un push sur main publie (voir les "if" des jobs)
on:
  push:
    paths:
      - "api/**"
      - "deploy/**"
      - "k8s/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  # Tests d'intégration : la vraie API contre un vrai PostgreSQL, jetable, détruit à la fin du job
  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Même version que la prod : un test sur une autre version ne prouve rien pour la prod
        image: postgres:18.6-alpine
        env:
          # Identifiants d'une base de test jetable, qui ne vit que le temps du job : pas des secrets
          POSTGRES_USER: clickfast_test
          POSTGRES_PASSWORD: clickfast_test
          POSTGRES_DB: clickfast_test
        ports:
          - 5432:5432
        # Les tests attendent que Postgres accepte vraiment les connexions, sinon ils échouent au hasard
        options: >-
          --health-cmd "pg_isready -U clickfast_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Un services: est joignable sur localhost depuis le job (pas par son nom, contrairement à Compose)
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: clickfast_test
      DB_PASSWORD: clickfast_test
      DB_NAME: clickfast_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # Le schéma existe avant le premier test
      - run: npm run migrate
      - run: npm run test:integration

  # Publication de l'image de l'API, taguée au sha du commit : sur main uniquement
  build-and-push:
    # Rien ne part tant que l'API n'a pas prouvé qu'elle marche contre une vraie base
    needs: [test, test-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast-api:${{ github.sha }}

  # Déploiement sur le cluster k3d : ce job tourne CHEZ NOUS (runner self-hosted), là où kubectl joint le cluster.
  # Aucun secret GitHub : kubectl lit le kubeconfig du poste. (Au jour 3, ce job déployait en SSH sur vm-prod.)
  deploy:
    needs: build-and-push
    # Push sur main uniquement : une branche ou une pull request ne fait jamais tourner de code sur notre machine
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # Jamais deux déploiements en même temps sur le même cluster
    concurrency: deploy-cluster
    env:
      TAG: ${{ github.sha }}
      KUBE_CONTEXT: k3d-clickfast-cluster
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      # Sur ce poste Windows, "bash" désigne WSL : on place Git Bash en tête du PATH
      - name: Git Bash pour les étapes suivantes
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"

      - uses: actions/checkout@v7

      - name: Cluster visé
        run: kubectl --context "$KUBE_CONTEXT" get nodes

      # Les manifestes du dépôt, avec le tag de l'image remplacé par le sha de ce commit (jamais latest).
      # Le Secret n'est pas dans le dépôt : il existe déjà dans le cluster (voir k8s/secret.example.yaml).
      - name: Application des manifestes (image ${{ github.sha }})
        run: |
          kubectl --context "$KUBE_CONTEXT" apply -f k8s/namespace.yaml -f k8s/config.yaml -f k8s/db.yaml -f k8s/ingress.yaml
          sed -E "s#(clickfast-api:)[0-9a-f]{40}#\1$TAG#" k8s/api.yaml | kubectl --context "$KUBE_CONTEXT" apply -f -

      # La pipeline ne déclare un succès que si le rollout converge : un tag absent ou un pod qui ne devient
      # jamais prêt fait échouer le job au bout du délai
      - name: Attente du rollout
        run: kubectl --context "$KUBE_CONTEXT" rollout status deployment/scores-api -n clickfast --timeout=180s

      - name: Vérification par l'Ingress
        run: |
          kubectl --context "$KUBE_CONTEXT" get deployment scores-api -n clickfast -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
          # Quelques essais : Traefik met un instant à prendre en compte les nouveaux pods
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 -H "Host: scores.localhost" http://localhost:8080/health
