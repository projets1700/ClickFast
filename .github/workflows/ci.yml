name: CI

on:
  push:
  pull_request:

jobs:
  # Stage 1 : le style du code. S'il casse, rien d'autre ne tourne (fail fast)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint

  # Stage 2 : les tests, seulement si le lint est vert
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # npm ci installe exactement le package-lock.json, comme dans les Dockerfile
      - run: npm ci
      - run: npm test

  # Stage 3 : l'image, seulement si les tests sont verts
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build de l'image du jeu
        run: docker build . --file Dockerfile --tag clickfast-front:${{ github.sha }}
