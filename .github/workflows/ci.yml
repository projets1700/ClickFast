name: CI

on:
  push:
  pull_request:

jobs:
  # Stage 1 : le style du code. S'il casse, rien d'autre ne tourne (fail fast)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache du dossier de téléchargement de npm, indexé sur le hash de package-lock.json
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Stage 2 : les tests, seulement si le lint est vert
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache du dossier de téléchargement de npm, indexé sur le hash de package-lock.json
          cache: npm
      # npm ci installe exactement le package-lock.json, comme dans les Dockerfile
      - run: npm ci
      - run: npm test

  # Stage 3, hors de main : l'image est construite pour vérifier qu'elle se build, jamais publiée
  build:
    needs: test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build de l'image du jeu
        run: docker build . --file Dockerfile --tag clickfast-front:${{ github.sha }}

  # Stage 3, sur main uniquement : on publie. Une pull request ne publie jamais du travail en chantier
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Identifiants dans Settings > Secrets and variables > Actions, jamais en clair ici
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tag = sha du commit : deux push sur main donnent deux images distinctes, et jamais "latest"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast-front:${{ github.sha }}
