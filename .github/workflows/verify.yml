name: Verify

# Toute pull request : lint, tests, scans du code et build de l'image, sans jamais rien publier
on:
  pull_request:

jobs:
  # Stage 1 : le style du code. S'il casse, rien d'autre ne tourne (fail fast)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache du dossier de téléchargement de npm, indexé sur le hash de package-lock.json
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Sécurité, en parallèle de lint et test : rien n'oblige à attendre les tests pour vérifier les dépendances
  security-deps:
    runs-on: ubuntu-latest
    outputs:
      audit: ${{ steps.audit.outcome }}
      audit_high: ${{ steps.audit.outputs.high }}
      audit_critical: ${{ steps.audit.outputs.critical }}
      gitleaks: ${{ steps.gitleaks.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tout l'historique : un secret supprimé au commit suivant reste lisible dans git log
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # SCA : on bloque sur high et critical, on laisse passer low et moderate
      - name: npm audit
        id: audit
        run: |
          npm audit --json > audit.json || true
          high=$(node -p "require('./audit.json').metadata.vulnerabilities.high")
          critical=$(node -p "require('./audit.json').metadata.vulnerabilities.critical")
          echo "high=$high" >> "$GITHUB_OUTPUT"
          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          npm audit --audit-level=high
      # Secret scanning sur tout l'historique, même si l'audit a échoué
      - name: gitleaks
        id: gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2 : les tests, seulement si le lint est vert
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache du dossier de téléchargement de npm, indexé sur le hash de package-lock.json
          cache: npm
      # npm ci installe exactement le package-lock.json, comme dans les Dockerfile
      - run: npm ci
      - run: npm test

  # Stage 3 : l'image est construite pour vérifier qu'elle se build, jamais publiée
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build de l'image du jeu
        run: docker build . --file Dockerfile --tag clickfast-front:${{ github.sha }}

  # Résumé de sécurité, lisible dans l'onglet Actions sans ouvrir un seul log
  security-summary:
    needs: [security-deps]
    # always() : le résumé s'écrit même si un job a échoué ou a été sauté
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Résumé
        env:
          AUDIT: ${{ needs.security-deps.outputs.audit }}
          AUDIT_HIGH: ${{ needs.security-deps.outputs.audit_high }}
          AUDIT_CRITICAL: ${{ needs.security-deps.outputs.audit_critical }}
          GITLEAKS: ${{ needs.security-deps.outputs.gitleaks }}
          PUSH: ""  # pas de publication sur une pull request
          IMAGE: ""  # pas de publication sur une pull request
          TRIVY_HIGH: ""  # pas de publication sur une pull request
          TRIVY_CRITICAL: ""  # pas de publication sur une pull request
          SBOM: ""  # pas de publication sur une pull request
          COMPONENTS: ""  # pas de publication sur une pull request
        run: |
          # Une valeur absente (job sauté, ou planté avant d'écrire) s'affiche "non mesuré", jamais 0
          v() { if [ -n "$1" ]; then echo "$1"; else echo "non mesuré"; fi; }
          icon() { case "$1" in "") echo "⏭️ non lancé";; success) echo "✅";; skipped) echo "⏭️ sauté";; cancelled) echo "⛔ annulé";; *) echo "❌ $1";; esac; }
          gl() { case "$1" in success) echo "aucun secret";; failure) echo "secret(s) trouvé(s)";; *) echo "non mesuré";; esac; }
          {
            echo "## Sécurité de ce commit"
            echo
            echo "| Contrôle | État | Résultat |"
            echo "| -------- | ---- | -------- |"
            echo "| Dépendances (npm audit) | $(icon "$AUDIT") | high : $(v "$AUDIT_HIGH"), critical : $(v "$AUDIT_CRITICAL") |"
            echo "| Secrets (gitleaks, tout l'historique) | $(icon "$GITLEAKS") | $(gl "$GITLEAKS") |"
            echo "| Publication de l'image | $(icon "$PUSH") | |"
            echo "| Image (Trivy) | $(icon "$IMAGE") | HIGH : $(v "$TRIVY_HIGH"), CRITICAL : $(v "$TRIVY_CRITICAL") |"
            echo "| Inventaire (SBOM Syft) | $(icon "$SBOM") | composants : $(v "$COMPONENTS") |"
            echo
            if [ "$AUDIT" != success ] || [ "$GITLEAKS" != success ]; then
              echo "**Verdict : ne pas publier en l'état.** Le contrôle des dépendances ou des secrets n'est pas vert."
            elif [ -z "$PUSH" ] || [ "$PUSH" = skipped ]; then
              echo "**Verdict : code vérifié, rien n'a été publié** (pull request ou publication sautée)."
            elif [ "$PUSH" = success ] && [ "$IMAGE" = success ] && [ "$SBOM" = success ]; then
              echo "**Verdict : publiable en confiance.** Tous les contrôles sont passés."
            else
              echo "**Verdict : ne pas publier en l'état.** Au moins un contrôle de l'image a échoué ou n'a pas pu tourner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
