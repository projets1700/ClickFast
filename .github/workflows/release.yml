name: Release

# Push sur main uniquement : c'est le seul chemin qui publie. Une pull request ne déclenche jamais ce fichier
on:
  push:
    branches: [main]

jobs:
  # Stage 1 : le style du code. S'il casse, rien d'autre ne tourne (fail fast)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache du dossier de téléchargement de npm, indexé sur le hash de package-lock.json
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Sécurité, en parallèle de lint et test : rien n'oblige à attendre les tests pour vérifier les dépendances
  security-deps:
    runs-on: ubuntu-latest
    outputs:
      audit: ${{ steps.audit.outcome }}
      audit_high: ${{ steps.audit.outputs.high }}
      audit_critical: ${{ steps.audit.outputs.critical }}
      gitleaks: ${{ steps.gitleaks.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tout l'historique : un secret supprimé au commit suivant reste lisible dans git log
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # SCA : on bloque sur high et critical, on laisse passer low et moderate
      - name: npm audit
        id: audit
        run: |
          npm audit --json > audit.json || true
          high=$(node -p "require('./audit.json').metadata.vulnerabilities.high")
          critical=$(node -p "require('./audit.json').metadata.vulnerabilities.critical")
          echo "high=$high" >> "$GITHUB_OUTPUT"
          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          npm audit --audit-level=high
      # Secret scanning sur TOUT l'historique, même si l'audit a échoué. Pas gitleaks-action : sur un push,
      # elle ne relit que les commits poussés, et un secret supprimé deux commits plus tôt lui échappe.
      # Image épinglée sur son digest ; safe.directory car le dépôt monté n'appartient pas à l'utilisateur du conteneur.
      - name: gitleaks
        id: gitleaks
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1

  # Stage 2 : les tests, seulement si le lint est vert
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache du dossier de téléchargement de npm, indexé sur le hash de package-lock.json
          cache: npm
      # npm ci installe exactement le package-lock.json, comme dans les Dockerfile
      - run: npm ci
      - run: npm test

  # Stage 3 : on publie (ce workflow ne tourne que sur main)
  build-and-push:
    # Une dépendance vulnérable ou un secret dans l'historique bloque aussi la publication
    needs: [test, security-deps]
    # Continuous Delivery : le job attend qu'un reviewer de l'environnement clique sur "approve"
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Identifiants dans Settings > Secrets and variables > Actions, jamais en clair ici
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tag = sha du commit : deux push sur main donnent deux images distinctes, et jamais "latest"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast-front:${{ github.sha }}

  # Container scanning : Trivy relit l'image qui vient d'être publiée (nginx, paquets Alpine)
  security-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      high: ${{ steps.count.outputs.high }}
      critical: ${{ steps.count.outputs.critical }}
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast-front:${{ github.sha }}
    steps:
      # Action épinglée sur le commit de la v0.36.0, pas sur un tag qu'on peut déplacer
      - name: Trivy, rapport complet
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy.json
          exit-code: "0"
      - name: Comptage HIGH / CRITICAL
        id: count
        run: |
          echo "high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy.json)" >> "$GITHUB_OUTPUT"
          echo "critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy.json)" >> "$GITHUB_OUTPUT"
      # Même seuil que npm audit : HIGH et CRITICAL bloquent
      - name: Trivy, seuil de blocage
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  # Inventaire de ce qui est publié : un SBOM CycloneDX de l'image, téléchargeable dans l'onglet Actions
  sbom:
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.count.outputs.components }}
    steps:
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast-front:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Comptage des composants
        id: count
        run: echo "components=$(jq '.components | length' sbom.cdx.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-clickfast-front-${{ github.sha }}
          path: sbom.cdx.json

  # Résumé de sécurité, lisible dans l'onglet Actions sans ouvrir un seul log
  security-summary:
    needs: [security-deps, build-and-push, security-image, sbom]
    # always() : le résumé s'écrit même si un job a échoué ou a été sauté
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Résumé
        env:
          AUDIT: ${{ needs.security-deps.outputs.audit }}
          AUDIT_HIGH: ${{ needs.security-deps.outputs.audit_high }}
          AUDIT_CRITICAL: ${{ needs.security-deps.outputs.audit_critical }}
          GITLEAKS: ${{ needs.security-deps.outputs.gitleaks }}
          PUSH: ${{ needs.build-and-push.result }}
          IMAGE: ${{ needs.security-image.result }}
          TRIVY_HIGH: ${{ needs.security-image.outputs.high }}
          TRIVY_CRITICAL: ${{ needs.security-image.outputs.critical }}
          SBOM: ${{ needs.sbom.result }}
          COMPONENTS: ${{ needs.sbom.outputs.components }}
        run: |
          # Une valeur absente (job sauté, ou planté avant d'écrire) s'affiche "non mesuré", jamais 0
          v() { if [ -n "$1" ]; then echo "$1"; else echo "non mesuré"; fi; }
          icon() { case "$1" in "") echo "⏭️ non lancé";; success) echo "✅";; skipped) echo "⏭️ sauté";; cancelled) echo "⛔ annulé";; *) echo "❌ $1";; esac; }
          gl() { case "$1" in success) echo "aucun secret";; failure) echo "secret(s) trouvé(s)";; *) echo "non mesuré";; esac; }
          {
            echo "## Sécurité de ce commit"
            echo
            echo "| Contrôle | État | Résultat |"
            echo "| -------- | ---- | -------- |"
            echo "| Dépendances (npm audit) | $(icon "$AUDIT") | high : $(v "$AUDIT_HIGH"), critical : $(v "$AUDIT_CRITICAL") |"
            echo "| Secrets (gitleaks, tout l'historique) | $(icon "$GITLEAKS") | $(gl "$GITLEAKS") |"
            echo "| Publication de l'image | $(icon "$PUSH") | |"
            echo "| Image (Trivy) | $(icon "$IMAGE") | HIGH : $(v "$TRIVY_HIGH"), CRITICAL : $(v "$TRIVY_CRITICAL") |"
            echo "| Inventaire (SBOM Syft) | $(icon "$SBOM") | composants : $(v "$COMPONENTS") |"
            echo
            if [ "$AUDIT" != success ] || [ "$GITLEAKS" != success ]; then
              echo "**Verdict : ne pas publier en l'état.** Le contrôle des dépendances ou des secrets n'est pas vert."
            elif [ -z "$PUSH" ] || [ "$PUSH" = skipped ]; then
              echo "**Verdict : code vérifié, rien n'a été publié** (pull request ou publication sautée)."
            elif [ "$PUSH" = success ] && [ "$IMAGE" = success ] && [ "$SBOM" = success ]; then
              echo "**Verdict : publiable en confiance.** Tous les contrôles sont passés."
            else
              echo "**Verdict : ne pas publier en l'état.** Au moins un contrôle de l'image a échoué ou n'a pas pu tourner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
