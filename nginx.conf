# Config complète pour un nginx qui tourne sans root (USER nginx dans le Dockerfile).
# Pas de directive "user" : elle n'a de sens que si le maître est root.

worker_processes auto;

# Le PID et les dossiers temporaires vont dans /tmp, seul endroit inscriptible par nginx :
# par défaut ils sont dans /run et /var/cache/nginx, qui appartiennent à root.
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /var/log/nginx/access.log;

    sendfile on;
    server_tokens off;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Généré au démarrage du conteneur par 40-clickfast-config.sh, hors de la racine servie
        location = /config.js {
            alias /tmp/config.js;
            add_header Cache-Control "no-store";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
